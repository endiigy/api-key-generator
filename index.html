```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Key Generator</title>

    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 24px;
        }

        .key {
            font-family: Consolas, Monaco, monospace;
            font-size: 1.1rem;
            word-break: break-all;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 24px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .status {
            margin-top: 16px;
            color: var(--muted);
            min-height: 20px;
        }

        .footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .9rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>API Key Generator</h1>

    <div class="subtitle">
        Generate cryptographically secure API keys in your browser.
    </div>

    <div class="key" id="key"></div>

    <div class="buttons">
        <button onclick="generateKey()">Generate New Key</button>
        <button onclick="copyKey()">Copy Key</button>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">
        No data is transmitted. All keys are generated locally in your browser.
    </div>
</div>

<script>
    function guidN() {
        return crypto.randomUUID().replaceAll('-', '');
    }

    function generateKey() {
        const key = guidN() + guidN();

        document.getElementById('key').textContent = key;
        document.getElementById('status').textContent =
            'Generated at ' + new Date().toLocaleTimeString();
    }

    async function copyKey() {
        const key = document.getElementById('key').textContent;

        try {
            await navigator.clipboard.writeText(key);
            document.getElementById('status').textContent =
                'Key copied to clipboard.';
        } catch {
            document.getElementById('status').textContent =
                'Unable to access clipboard.';
        }
    }

    generateKey();
</script>

</body>
</html>
```
